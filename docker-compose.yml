# docker compose --profile exit-node up -d --build
# docker compose --profile exit-custom up -d --build  # one configurable exit
services:
  client:
    build: .
    image: openflux:local
    restart: unless-stopped
    profiles: [client]
    environment:
      ROLE: client
      TRANSPORT: ${TRANSPORT:-yandex}
      URL: ${DOC_URL:-}
      MAX_TOKEN: ${MAX_TOKEN:-}
      MAX_UID: ${MAX_UID:-}
      SOCKS5_LISTEN: ${SOCKS5_LISTEN:-:1080}
      DEBUG: ${DEBUG:-0}
    ports:
      - "127.0.0.1:1080:1080"

  exit-node:
    build: .
    image: openflux:local
    restart: unless-stopped
    profiles: [exit-custom]
    environment:
      ROLE: exit-node
      TRANSPORT: ${TRANSPORT:-yandex}
      URL: ${DOC_URL:-}
      MAX_TOKEN: ${MAX_TOKEN:-}
      MAX_UID: ${MAX_UID:-}
      LOCAL_IP: ${EXIT_LOCAL_IP:-}
      DEBUG: ${DEBUG:-0}
    cap_add: [NET_RAW, NET_ADMIN]

  exit-yandex:
    build: .
    image: openflux:local
    restart: unless-stopped
    profiles: [exit-node]
    environment:
      ROLE: exit-node
      TRANSPORT: yandex
      URL: ${YANDEX_URL:?Set YANDEX_URL}
      DIRECT_LISTEN: 0.0.0.0:8445
      SHARE_HOST: ${SHARE_HOST:-}
      DEBUG: ${DEBUG:-0}
    ports: ["8445:8445/tcp"]
    volumes: [yandex-data:/data]
    cap_add: [NET_RAW, NET_ADMIN]

  exit-vyandex:
    build: .
    image: openflux:local
    restart: unless-stopped
    profiles: [exit-node]
    environment:
      ROLE: exit-node
      TRANSPORT: vyandex
      URL: ${VYANDEX_URL:?Set VYANDEX_URL}
      DIRECT_LISTEN: 0.0.0.0:8446
      SHARE_HOST: ${SHARE_HOST:-}
      DEBUG: ${DEBUG:-0}
    ports: ["8446:8446/tcp"]
    volumes: [vyandex-data:/data]
    cap_add: [NET_RAW, NET_ADMIN]

  exit-boards:
    build: .
    image: openflux:local
    restart: unless-stopped
    profiles: [exit-node]
    environment:
      ROLE: exit-node
      TRANSPORT: boards
      URL: ${BOARDS_URL:?Set BOARDS_URL}
      DIRECT_LISTEN: 0.0.0.0:8447
      SHARE_HOST: ${SHARE_HOST:-}
      DEBUG: ${DEBUG:-0}
    ports: ["8447:8447/tcp"]
    volumes: [boards-data:/data]
    cap_add: [NET_RAW, NET_ADMIN]

  exit-mailru:
    build: .
    image: openflux:local
    restart: unless-stopped
    profiles: [exit-node]
    environment:
      ROLE: exit-node
      TRANSPORT: mailru
      URL: ${MAILRU_URL:?Set MAILRU_URL}
      DEBUG: ${DEBUG:-0}
    volumes: [mailru-data:/data]
    cap_add: [NET_RAW, NET_ADMIN]

  exit-cupsonline:
    build: .
    image: openflux:local
    restart: unless-stopped
    profiles: [exit-node]
    environment:
      ROLE: exit-node
      TRANSPORT: cupsonline
      DEBUG: ${DEBUG:-0}
    volumes: [cupsonline-data:/data]
    cap_add: [NET_RAW, NET_ADMIN]

volumes:
  yandex-data:
  vyandex-data:
  boards-data:
  mailru-data:
  cupsonline-data:
